<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Rishabh Fitness</title>
    <link href="https://fonts.googleapis.com/css?family=Baloo+Bhai&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Baloo Bhai', cursive;
            color: white;
            margin: 0;
            padding: 0;
            background: url('img/bg.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }
        .header {
            display: flex;
            justify-content: space-between; /* Ensures space between logo and nav */
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .left {
            display: flex;
            align-items: center;
        }
        .left img {
            width: 50px;
            margin-right: 10px;
        }
        .navbar {
            list-style: none;
            padding: 0;
            margin: 0 auto;
            display: flex;
            justify-content: center; /* Centers navigation items */
            align-items: center;
            flex: 1; /* Allows nav items to take available space */
        }
        .navbar li {
            margin: 0 15px;
        }
        .navbar li a {
            color: white;
            text-decoration: none;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: medium;
        }
        .navbar li a:hover, .navbar li a.active {
            color: grey;
            text-decoration: underline;
        }
        .right {
            display: none; /* Hide the right content (e.g., buttons) for now */
        }
        .btn {
            border: 2px solid grey;
            border-radius: 10px;
            padding: 4px 10px;
            background-color: black;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn:hover {
            background-color: grey;
        }
        .container {
            position: relative;
            margin: 20px auto;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-sizing: border-box;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            color: white;
        }
        input {
            border: 1px solid #ccc;
            border-radius: 10px;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            font-size: medium;
            box-sizing: border-box;
        }
        .btn1 {
            border: 2px solid white;
            border-radius: 10px;
            background-color: black;
            color: white;
            width: 100%;
            padding: 10px;
            cursor: pointer;
            text-decoration: none;
            font-size: medium;
        }
        .btn1:hover {
            background-color: grey;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
        }
        .navbar.active {
            display: block;
            flex-direction: column;
            text-align: center;
        }
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            .navbar {
                display: none;
                flex-direction: column;
            }
            .navbar.active {
                display: flex;
            }
            .right {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="overlay"></div>
    <header class="header">
        <div class="left">
            <img src="img/logo.jpg" alt="Gym Logo">
            <div>Rishabh's GYM</div>
        </div>
        <ul class="navbar">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="fitness.html">Fitness Calculator</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <div class="hamburger" onclick="toggleNavbar()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>
    <div class="container">
        <p>Join the best GYM of Mumbai now</p>
        <form action="submit.html" method="GET">
            <input type="text" placeholder="Enter your Name" required>
            <input type="date" placeholder="Enter your Age" required>
            <input type="text" placeholder="Enter your Gender" required>
            <input type="text" placeholder="Enter your Locality" required>
            <button class="btn1" type="submit">Submit</button>
        </form>
    </div>

    <script>
        function toggleNavbar() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('active');
        }
    </script>
</body>

</html>
