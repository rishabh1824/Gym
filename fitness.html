<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>New Fitness Calculator</title>
    <link href="https://fonts.googleapis.com/css?family=Baloo+Bhai&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Baloo Bhai', cursive;
            color: white;
            margin: 0;
            padding: 0;
            background: url('img/cal.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            z-index: 1;
        }

        .left {
            display: flex;
            align-items: center;
        }

        .left img {
            width: 50px;
            margin-right: 10px;
        }

        .mid {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .navbar {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .navbar li {
            margin: 0 15px;
        }

        .navbar li a {
            color: white;
            text-decoration: none;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: medium;
        }

        .navbar li a:hover,
        .navbar li a.active {
            color: grey;
            text-decoration: underline;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
        }

        .container {
            position: relative;
            top: 150px;
            margin: 0 auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            background-color: rgba(0, 0, 0, 0.7);
            text-align: center;
            border-radius: 10px;
        }

        input {
            border: 1px solid #ccc;
            border-radius: 10px;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            font-size: medium;
            box-sizing: border-box;
        }

        button {
            border: 2px solid white;
            border-radius: 10px;
            background-color: black;
            color: white;
            width: 100%;
            padding: 10px;
            cursor: pointer;
            font-size: large;
        }

        button:hover {
            background-color: grey;
        }

        h1,
        h2 {
            margin-bottom: 20px;
        }

        p {
            margin-top: 20px;
            font-size: large;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .navbar {
                display: none;
                flex-direction: column;
                align-items: center;
                width: 100%;
                background-color: rgba(0, 0, 0, 0.9);
                position: absolute;
                top: 100%;
                left: 0;
            }

            .navbar.active {
                display: flex;
            }

            .container {
                width: 95%;
                padding: 15px;
            }

            .hamburger {
                position: relative;
                right: 0;
                top: 0;
                align-items: flex-end;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="left">
            <a href="index.html">
                <img src="img/logo.jpg" alt="Gym Logo">
            </a>
            <div>Rishabh Gym</div>
        </div>
        <div class="mid">
            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="fitness.html" class="active">Fitness Calculator</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </div>
        <div class="hamburger" onclick="toggleNavbar()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>
    <div class="container">
        <h1>Fitness Calculator</h1>
        <h2>BMI Calculator</h2>
        <form id="bmiForm">
            <input type="number" id="weight" placeholder="Enter your weight (kg)" required>
            <input type="number" id="height" placeholder="Enter your height (cm)" required>
            <button type="button" onclick="calculateBMI()">Calculate BMI</button>
        </form>
        <p id="result"></p>
    </div>
    <script>
        function toggleNavbar() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('active');
        }

        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value) / 100; // Convert cm to meters
            const bmi = weight / (height * height);
            const result = document.getElementById('result');
            result.textContent = `Your BMI is: ${bmi.toFixed(2)}`;

            if (bmi < 18.5) {
                result.textContent += ' (Underweight)';
            } else if (bmi >= 18.5 && bmi < 24.9) {
                result.textContent += ' (Normal weight)';
            } else if (bmi >= 25 && bmi < 29.9) {
                result.textContent += ' (Overweight)';
            } else {
                result.textContent += ' (Obesity)';
            }
        }
    </script>
</body>

</html>
