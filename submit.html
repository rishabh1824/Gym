<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Gym New Plans</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Baloo Bhai', cursive;
            color: white;
            background: url('img/bg2.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            z-index: 1;
        }

        .left {
            display: flex;
            align-items: center;
        }

        .left img {
            width: 50px;
            margin-right: 10px;
        }

        .mid {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .navbar {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .navbar li {
            margin: 0 15px;
        }

        .navbar li a {
            color: white;
            text-decoration: none;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: medium;
        }

        .navbar li a:hover,
        .navbar li a.active {
            color: grey;
            text-decoration: underline;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            padding: 120px 20px 0; /* Adjusted for header height */
            text-align: center;
            gap: 20px;
        }

        .plan {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 10px;
            padding: 20px;
            width: 250px;
            margin: 20px;
            text-align: center;
        }

        .plan h2 {
            margin: 0 0 10px;
        }

        .plan p {
            margin: 10px 0;
        }

        .plan .price {
            font-size: 1.5em;
            margin: 10px 0;
        }

        .btn {
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px 20px;
            margin: 10px;
            background-color: black;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: grey;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .navbar {
                display: none;
                flex-direction: column;
                align-items: center;
                width: 100%;
                background-color: rgba(0, 0, 0, 0.9);
                position: absolute;
                top: 100%;
                left: 0;
                padding: 10px 0;
            }

            .navbar.active {
                display: flex;
            }

            .container {
                flex-direction: column;
                padding: 140px 10px 0;
            }

            .plan {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="left">
            <img src="img/logo.jpg" alt="Gym Logo">
            <div>Rishabh's GYM</div>
        </div>
        <div class="hamburger" onclick="toggleNavbar()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="mid">
            <ul class="navbar">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="fitness.html">Fitness Calculator</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </div>
    </header>
    <div class="container">
        <div class="plan">
            <h2>BASIC</h2>
            <p>Access to gym equipment</p>
            <p class="price">$20/month</p>
            <button class="btn" onclick="location.href='contact_info.html'">Select</button>
        </div>
        <div class="plan">
            <h2>STANDARD</h2>
            <p>Access to gym equipment</p>
            <p>Group fitness classes</p>
            <p class="price">$40/month</p>
            <button class="btn" onclick="location.href='contact_info.html'">Select</button>
        </div>
        <div class="plan">
            <h2>PREMIUM</h2>
            <p>Access to gym equipment</p>
            <p>Group fitness classes</p>
            <p>Personal training sessions</p>
            <p class="price">$60/month</p>
            <button class="btn" onclick="location.href='contact_info.html'">Select</button>
        </div>
    </div>

    <script>
        function toggleNavbar() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('active');
        }
    </script>
</body>

</html>
