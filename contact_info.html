<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Contact Information</title>
    <style>
        body {
            font-family: 'Baloo Bhai', cursive;
            color: white;
            margin: 0;
            padding: 0;
        }
        .bgimg {
            position: fixed;
            height: 100vh;
            width: 100vw;
            top: 0;
            left: 0;
            z-index: -1;
            object-fit: cover; /* Ensures image covers the screen proportionally */
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            z-index: 1;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .left img {
            width: 50px;
            margin-right: 10px;
        }
        .mid {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .navbar {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }
        .navbar li {
            margin: 0 15px;
        }
        .navbar li a {
            color: white;
            text-decoration: none;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: medium;
        }
        .navbar li a:hover, .navbar li a.active {
            color: grey;
            text-decoration: underline;
        }
        .right {
            display: flex;
            gap: 10px;
        }
        .btn {
            border: 2px solid grey;
            border-radius: 10px;
            padding: 5px 15px;
            background-color: black;
            color: white;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap; /* Prevents button text from wrapping */
        }
        .btn:hover {
            background-color: grey;
        }
        .container {
            position: relative;
            top: 150px;
            margin: 0 auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            background-color: rgba(0, 0, 0, 0.7);
            text-align: center;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .container h1 {
            margin-bottom: 20px;
        }
        input {
            border: 1px solid #ccc;
            border-radius: 10px;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: medium;
            box-sizing: border-box;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
        }
        .navbar {
            transition: max-height 0.3s ease-out;
            overflow: hidden;
        }
        .navbar.active {
            display: block;
            flex-direction: column;
            align-items: center;
            max-height: 300px; /* Expands when active */
        }
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
                
            }
            .navbar {
                display: none;
                max-height: 0; /* Collapses by default */
            }
            .navbar.active {
                display: flex;
            }
            .right {
                justify-content: center; /* Center buttons on smaller screens */
                gap: 5px;
                flex-wrap: wrap;
            }
            .container {
                width: 95%;
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <img class="bgimg" src="./img/bg3.jpg" alt="Background Image">
    <header class="header">
        <div class="left">
            <img src="img/logo.jpg" alt="Gym Logo">
            <div>Rishabh's GYM</div>
        </div>
        <div class="hamburger" onclick="toggleNavbar()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="mid">
            <ul class="navbar">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="fitness.html">Fitness Calculator</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </div>
        <div class="right">
            <button class="btn" onclick="window.location.href='tel:+911234567890'">Call us Now</button>
            <button class="btn" onclick="window.location.href='mailto:info@rishabhgym.com'">Email Us</button>
        </div>
    </header>
    <div class="container">
        <h1>Rishabh's GYM</h1>
        <form action="confirmation.html" method="get">
            <input type="text" name="contact" placeholder="Enter your Contact Number" required>
            <input type="text" name="address" placeholder="Enter your Address" required>
            <input type="text" name="time" placeholder="Preferred Time for Gym" required>
            <button class="btn" type="submit">Submit</button>
        </form>
    </div>

    <script>
        function toggleNavbar() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('active');
        }
    </script>
</body>

</html>
