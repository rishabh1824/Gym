<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Contact Us - Rishabh Fitness</title>
    <link href="https://fonts.googleapis.com/css?family=Baloo+Bhai&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Baloo Bhai', cursive;
            color: white;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: url('img/bg5.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            z-index: 1;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .left img {
            width: 50px;
            margin-right: 10px;
        }
        .mid {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .navbar {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }
        .navbar li {
            margin: 0 15px;
        }
        .navbar li a {
            color: white;
            text-decoration: none;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: medium;
        }
        .navbar li a:hover, .navbar li a.active {
            color: grey;
            text-decoration: underline;
        }
        .right {
            display: flex;
            flex-wrap: wrap; /* Allow buttons to wrap */
            gap: 10px; /* Add space between buttons */
            justify-content: flex-end; /* Align buttons to the right */
        }
        .btn {
            border: 2px solid grey;
            border-radius: 10px;
            padding: 5px 15px;
            background-color: black;
            color: white;
            cursor: pointer;
            white-space: nowrap; /* Prevent text wrapping */
            max-width: 100%; /* Ensure buttons don't overflow */
        }
        .btn:hover {
            background-color: grey;
        }
        .container {
            position: relative;
            top: 120px;
            margin: 0 auto;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            text-align: center;
        }
        h1, p {
            margin-bottom: 20px;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
        }
        .navbar {
            transition: max-height 0.3s ease-out;
            overflow: hidden;
        }
        .navbar.active {
            display: block;
            flex-direction: column;
            align-items: center;
            max-height: 300px; /* Expands when active */
        }
        @media (max-width: 768px) {
            .navbar {
                display: none;
                max-height: 0; /* Collapses by default */
            }
            .hamburger {
                display: flex;
            }
            .navbar.active {
                display: flex;
            }
            .right {
                justify-content: center; /* Center buttons on smaller screens */
                gap: 5px;
            }
            .container {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="left">
            <a href="index.html">
                <img src="img/logo.jpg" alt="Gym Logo">
            </a>
            <div>Rishabh Gym</div>
        </div>
        <div class="mid">
            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="fitness.html">Fitness Calculator</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </div>
        <div class="right">
            <button class="btn" onclick="window.location.href='tel:+911234567890'">Call us Now</button>
            <button class="btn" onclick="window.location.href='mailto:info@rishabhgym.com'">Email Us</button>
        </div>
        <div class="hamburger" onclick="toggleNavbar()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>
    <div class="container">
        <h1>Contact Us</h1>
        <p>Phone: +91 78109004769</p>
        <p>Address: Rishabh's Gym, 123 Fitness Street, Mumbai, Maharashtra, India</p>
    </div>

    <script>
        function toggleNavbar() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('active');
        }
    </script>
</body>

</html>
