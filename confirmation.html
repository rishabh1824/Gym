<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Form Submission Confirmation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }

        body {
            font-family: 'Baloo Bhai', cursive;
            color: white;
            background: url('img/bg4(1).png') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }


        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            position: absolute;
            top: 0;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .left {
            display: flex;
            align-items: center;
        }
        .left img {
            width: 50px;
            margin-right: 10px;
        }
        .right {
            display: flex;
            gap: 10px;
        }
        .btn {
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px 20px;
            background-color: black;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: grey;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 50px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            box-sizing: border-box;
        }
        .container h1 {
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                padding: 10px;
            }
            .left {
                justify-content: center;
                margin-bottom: 10px;
            }
            .right {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="overlay"></div>
    <header class="header">
        <div class="left">
            <a href="index.html">
                <img src="img/logo.jpg" alt="Gym Logo">
            </a>
            <div>Rishabh Gym</div>
        </div>
        <div class="right">
            <button class="btn" onclick="window.location.href='tel:+911234567890'">Call us Now</button>
            <button class="btn" onclick="window.location.href='mailto:info@rishabhgym.com'">Email Us</button>
        </div>
    </header>
    <div class="container">
        <h1>Rishabh's GYM</h1>
        <p>YOUR FORM IS SUBMITTED</p>
        <p>WE WILL REACH YOU OUT SOON</p>
        <p>Thank you for choosing Rishabh's Gym!</p>
        <button class="btn" onclick="location.href='index.html'">Go to Home</button>
    </div>
</body>

</html>
